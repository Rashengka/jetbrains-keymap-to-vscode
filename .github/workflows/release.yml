name: release

# A release is an annotated tag vX.Y.Z made by `go run ./tools/release`.
# The GitHub release with binaries is created only when the tag matches
# internal/release/VERSION in the tagged commit and describes the release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # actions/checkout may turn an annotated tag into a lightweight one;
      # fetch it again so its message (the release notes) is there.
      - run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...
      - name: Check tag
        run: go run ./tools/release check "$GITHUB_REF_NAME" notes.txt
      - run: make dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.txt --verify-tag
